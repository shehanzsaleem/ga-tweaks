<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      margin: 0; padding: 16px; width: 260px;
      color: #202124; background: #fff;
    }
    h1 { font-size: 14px; font-weight: 500; margin: 0 0 14px; }
    label { display: block; font-size: 12px; color: #5f6368; margin: 0 0 4px; }
    input {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #dadce0; border-radius: 4px;
      font: inherit; font-size: 13px; margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #1a73e8; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      width: 100%; padding: 9px; border: 0; border-radius: 4px;
      background: #1a73e8; color: #fff; font: inherit; font-size: 13px;
      font-weight: 500; cursor: pointer;
    }
    button:hover { background: #1765cc; }
    .hint { font-size: 11px; color: #5f6368; margin: 10px 0 0; line-height: 1.4; }
    .saved { color: #188038; font-size: 12px; text-align: center; height: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Estimated Revenue settings</h1>

  <label for="label">Card label</label>
  <input id="label" type="text" maxlength="24" />

  <div class="row">
    <div>
      <label for="currency">Currency</label>
      <input id="currency" type="text" maxlength="3" />
    </div>
    <div>
      <label for="divisor">Views per unit</label>
      <input id="divisor" type="number" min="1" step="1" />
    </div>
  </div>

  <label for="baseDays">Over how many days</label>
  <input id="baseDays" type="number" min="1" step="1" />

  <button id="save">Save</button>
  <div class="saved" id="saved"></div>

  <p class="hint">
    500 views per unit over 28 days scales with the range you're viewing:
    14 days divides by 250, 8 weeks by 1000.
    Reload the Analytics tab if the card doesn't update immediately.
  </p>

  <script src="popup.js"></script>
</body>
</html>
